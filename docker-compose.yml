version: "3.9"
services:
  spring-image-docker:
    image: spring-image-docker
    container_name: spring-container-docker
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    networks:
      - docker-umg-network
    depends_on:
      - mariadb
  
  mariadb:
    image: mariadb:latest
    container_name: mariadb_docker
    environment:
      MARIADB_ROOT_PASSWORD: admin
      MARIADB_DATABASE: gameProyectodb
      MARIADB_USER: svega
      MARIADB_PASSWORD: admin
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - docker-umg-network

networks:
  docker-umg-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
    
volumes:
  mariadb_data: