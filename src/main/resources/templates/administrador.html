<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Administrar Usuarios</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 20px;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 8px;
        text-align: left;
      }
      th {
        background-color: #f2f2f2;
      }
      input,
      select {
        padding: 6px;
        margin: 4px 0;
        width: 200px;
      }
      button {
        padding: 6px 12px;
        margin-top: 10px;
        cursor: pointer;
      }
      .alert {
        margin-top: 10px;
        padding: 6px;
        border-radius: 4px;
      }
      .success {
        background-color: #2ecc71;
        color: white;
      }
      .error {
        background-color: #e74c3c;
        color: white;
      }
      h1{
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div style="display: flex; justify-content: flex-end; padding: 8px">
      <button
        onclick="onClickLoggout()"
        style="
          background-color: #c0392b;
          color: white;
          border: none;
          padding: 6px 12px;
          border-radius: 4px;
          cursor: pointer;
        "
      >
        Cerrar sesión
      </button>
    </div>
    <h1 id="id-title"></h1>
    <h2>Administrar Usuarios</h2>

    <h3>Crear nuevo usuario</h3>
    <div>
      <input type="text" id="nombre" placeholder="Nombre" />
      <input type="email" id="correo" placeholder="Correo" />
      <input type="password" id="password" placeholder="Contraseña" />
      <select id="rol">
        <option value="ADMIN">ADMIN</option>
        <option value="USER">USER</option>
      </select>
      <button id="btnCrear" onclick="onClikcCrearUser()">Crear Usuario</button>
      <div id="mensaje" class="alert" style="display: none"></div>
    </div>

    <h3>Usuarios existentes</h3>
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Correo</th>
          <th>Rol</th>
          <th>Opciones</th>
        </tr>
      </thead>
      <tbody id="tablaUsuarios">
        <!-- Se llenará dinámicamente -->
      </tbody>
    </table>

    <script th:src="@{/script/administrador.js}"></script>
  </body>
</html>
